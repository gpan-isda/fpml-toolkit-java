# external-source.properties
# ---------------------------------------------------------------------------
# Paths to FpML specification repositories used by resolve-sources.bat.
# Edit these values to match your local clone of the FpML validation repo
# and any other external source trees.
#
# FPML_VALIDATION_REPO
#   The root directory of a local clone of the fpml-validation-shared
#   repository.  When set, resolve-sources.bat creates directory junctions
#   (Windows) or symlinks (Unix) so that the toolkit's files-fpml/ subtree
#   points at the canonical schema and test-case trees from that repo.
#
# FPML_SCHEMAS_REPO (optional)
#   A separate schemas-only clone, if schemas are maintained independently
#   of the validation repo.  Leave blank to derive schemas from
#   FPML_VALIDATION_REPO.
# ---------------------------------------------------------------------------

# Example (Windows absolute paths, forward slashes acceptable):
#   FPML_VALIDATION_REPO=C:/repos/fpml-validation-shared
#   FPML_SCHEMAS_REPO=
FPML_VALIDATION_REPO=
FPML_SCHEMAS_REPO=

